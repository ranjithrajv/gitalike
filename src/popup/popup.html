<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GitAlike</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <svg class="head__mark" viewBox="0 0 128 128" aria-hidden="true">
        <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M28 46h64M74 28l18 18-18 18" stroke="#fca326" />
          <path d="M100 82H36M54 64 36 82l18 18" stroke="#8b949e" />
        </g>
      </svg>
      <div>
        <h1>GitAlike</h1>
        <p>Swap the interface, keep the site.</p>
      </div>
    </header>

    <main>
      <!-- One component does both jobs: classify the host you are on, and add
           one you are not. It auto-opens (and prefills) when the current host
           needs a decision. -->
      <section class="add" id="add">
        <button
          type="button"
          class="add__toggle"
          id="add-toggle"
          aria-expanded="false"
          aria-controls="add-body"
        >
          <span id="add-summary">Add a site</span>
          <span class="add__chevron" aria-hidden="true">＋</span>
        </button>

        <div class="add__body" id="add-body" hidden>
          <input
            type="text"
            id="add-input"
            class="add__input"
            placeholder="github.acme.com"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Site address"
          />
          <p class="add__hint" id="add-hint">Which product is it?</p>
          <div class="add__actions">
            <button type="button" class="add__button" data-kind="github">
              GitHub
            </button>
            <button type="button" class="add__button" data-kind="gitlab">
              GitLab
            </button>
            <button type="button" class="add__button" data-kind="bitbucket">
              Bitbucket
            </button>
            <button type="button" class="add__button" data-kind="gerrit">
              Gerrit
            </button>
            <button
              type="button"
              class="add__button add__button--quiet"
              id="add-remove"
              hidden
            >
              Remove
            </button>
          </div>
        </div>
      </section>

      <!-- One skin at a time for the whole extension: picking a skin turns the
           other off, so a host can never wear two. The per-site picker below
           can still override a single host. -->
      <section class="skin" id="skin">
        <p class="skin__title">Show the web with</p>
        <div
          class="skin__options"
          id="skin-options"
          role="radiogroup"
          aria-label="Skin"
        ></div>
      </section>

      <!-- Only for a host the extension knows: pick which skin *this* host wears,
           independent of the global skin. The options are generated from the
           shared `skins` table, so a new skin appears here automatically. -->
      <div class="site" id="site" hidden>
        <p class="site__title">Show <b id="site-host">this site</b> with</p>
        <div
          class="site__options"
          id="site-options"
          role="radiogroup"
          aria-label="Skin for this site"
        ></div>
        <button type="button" class="site__reset" id="site-reset" hidden>
          Follow the global skin
        </button>
      </div>

      <button type="button" class="open-other" id="open-other" hidden></button>

      <!-- Opens a prefilled issue, so a skin miss is reported with the context
           CONTRIBUTING.md asks for. Nothing is read from the page: the body is
           filled with what the popup already knows, and the reporter pastes the
           element/property themselves. -->
      <button type="button" class="report" id="report">Report a missed spot</button>
    </main>

    <footer class="foot">
      <kbd id="shortcut">…</kbd>
      <span>toggles this site</span>
    </footer>

    <script src="../lib/sites.js"></script>
    <script src="../lib/ux.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
