<!--
  GitLab's tanuki, keeping its shape but wearing GitHub's colour scheme.

  The path is GitLab's own mark; the fill is a gradient across Primer's
  dark-mode ink (#f0f6fc) and accent blue (#4493f8). It lands on the dark
  header Git Same gives a GitLab-flavoured site, where GitHub's own mark is
  white — so this is best previewed on a dark background.

  Baked into src/themes/gitlab-as-github.css as --gs-tanuki.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="GitLab tanuki in GitHub colours">
  <title>GitLab tanuki in GitHub colours</title>
  <defs>
    <linearGradient id="github" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f6fc"/>
      <stop offset="1" stop-color="#4493f8"/>
    </linearGradient>
  </defs>
