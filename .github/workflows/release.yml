name: Release

# Triggered by the tag, not by main. That is the whole point: the artifacts
# attached to a release have to be built from the commit the tag points at,
# never from whatever happens to be on the branch. `actions/checkout` checks out
# the tag ref here, so the ZIPs and the release always describe the same code.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    # gh release create needs to write to the repo; nothing else in this job
    # does, so the token is scoped here rather than at the workflow level.
    permissions:
      contents: write
    steps:
      # Actions are pinned to a full commit SHA (with the version in a comment)
      # so a retagged or compromised release cannot run in a job that holds a
      # write-scoped token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        # Neither dev dependency needs a lifecycle script; skip them so a
        # compromised package cannot execute at install time.
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      # Builds the Firefox target and validates it with web-ext.
      - name: Lint the extension
        run: npm run lint

      # Builds both targets and writes dist/artifacts/{chromium,firefox}/*.zip.
      - name: Package the store ZIPs
        run: npm run package

      # Store publishing is opt-in and gated on a repository *variable* (not a
      # secret), so the credentials can be scoped to the single step that needs
      # them instead of the whole job's environment.
      - name: Sign the Firefox build for AMO
        if: ${{ vars.AMO_SIGN == 'true' }}
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: npm run sign:firefox

      - name: Stage the release assets
        run: |
          # Two things have to be true of the asset names.
          #
          # 1. They must be distinct. web-ext names the ZIP after the extension,
          #    so both targets come out with the same name; two assets cannot
          #    share a name (HTTP 422), and gh's `file#label` form only sets the
          #    display label, so the underlying asset keeps colliding.
          # 2. They must NOT carry the version. The README links to
          #    /releases/latest/download/<name>, and that URL only keeps working
          #    if the name is stable across releases.
          #
          # So stage them under a fixed, per-target name. `ls -t` takes the
          # newest if an artifacts directory ever holds more than one package.
          mkdir -p dist/release
          cp "$(ls -t dist/artifacts/chromium/*.zip | head -1)" dist/release/gitalike-chromium.zip
          cp "$(ls -t dist/artifacts/firefox/*.zip | head -1)" dist/release/gitalike-firefox.zip
          if [ -f dist/artifacts/firefox-signed/*.xpi ]; then
            cp dist/artifacts/firefox-signed/*.xpi dist/release/gitalike-firefox-signed.xpi
          fi
          ls -l dist/release

      - name: Publish to the Chrome Web Store
        if: ${{ vars.CWS_PUBLISH == 'true' }}
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
        # The staged package, so the exact bytes that are attached to the
        # release are the bytes the store receives.
        run: node tools/publish-chromium.mjs --source dist/release/gitalike-chromium.zip

      # Edge accepts the same MV3 package as Chrome, so the staged Chromium ZIP
      # is reused rather than rebuilt. Opt-in via a repository variable, like CWS.
      - name: Publish to Microsoft Edge Add-ons
        if: ${{ vars.EDGE_PUBLISH == 'true' }}
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: node tools/publish-edge.mjs --source dist/release/gitalike-chromium.zip

      - name: Build the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Built from the \`${GITHUB_REF_NAME}\` tag."
            echo
            echo "| Asset | Target | How to install |"
            echo "| --- | --- | --- |"
            echo "| \`gitalike-chromium.zip\` | Chromium, Chrome, Edge, Brave | Unzip, then **Load unpacked** — or install from the Chrome Web Store. |"
            echo "| \`gitalike-firefox.zip\` | Firefox | Unsigned, so it only loads temporarily — see below. |"
            if [ -f dist/artifacts/firefox-signed/*.xpi ]; then
              echo "| \`gitalike-firefox-signed.xpi\` | Firefox | Signed, so it installs permanently. |"
            fi
            echo
            echo "> The Firefox asset is unsigned and can therefore only be loaded"
            echo "> temporarily via \`about:debugging\`; it disappears when Firefox"
            echo "> restarts. Permanent installs come from addons.mozilla.org."
            echo
            echo "### What changed"
            echo
            awk -v want="$version" '
              $0 ~ "^## \\[" want "\\]" { inside = 1; next }
              inside && /^## \[/ { exit }
              inside { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A glob that matches nothing would be passed through literally and
          # make gh fail, so build the asset list explicitly.
          assets=(dist/release/*.zip)
          if [ -f dist/release/gitalike-firefox-signed.xpi ]; then
            assets+=(dist/release/gitalike-firefox-signed.xpi)
          fi
          # A tag can already have a release when this job runs — created by
          # hand, or by an earlier run that died after creating it. `gh release
          # create` aborts in that case ("a release with the same tag name
          # already exists") and takes the assets down with it, which is how
          # v0.1.2 shipped with none and every /releases/latest/download link
          # 404'd. So create when absent and otherwise re-upload onto the
          # existing release, re-running the notes step either way.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; uploading assets to it."
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${assets[@]}"
          fi

      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The site links to /releases/latest/download/<name> with a fixed
          # per-target name, so a release that is missing (or renames) either
          # asset silently breaks every download button. Check the tag-scoped
          # URLs, retrying while the CDN catches up, and fail the run rather
          # than leave a release the site cannot serve.
          for name in gitalike-chromium.zip gitalike-firefox.zip; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
            code=""
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
              [ "$code" = "200" ] && break
              echo "attempt ${attempt}: ${url} -> ${code}; retrying"
              sleep 3
            done
            if [ "$code" != "200" ]; then
              echo "::error::${url} returned ${code}"
              exit 1
            fi
            echo "${name} -> ${code}"
          done
